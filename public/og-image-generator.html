<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>OG Image Generator — Defektologiya PRO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background-color: #1F2E3D;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      color: #F7F2E9;
    }

    .og-container {
      position: relative;
      width: 1200px;
      height: 630px;
      display: flex;
      background-color: #1F2E3D;
      overflow: hidden;
    }

    /* Left Half (0 - 600px) */
    .left-side {
      position: relative;
      width: 600px;
      height: 630px;
      overflow: hidden;
    }

    .hero-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 15%;
      display: block;
    }

    .img-fade-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, rgba(31, 46, 61, 0) 40%, rgba(31, 46, 61, 0.6) 75%, #1F2E3D 100%);
    }

    /* Vertical Divider at x=600px */
    .divider-line {
      position: absolute;
      left: 600px;
      top: 40px;
      bottom: 40px;
      width: 1px;
      background: rgba(173, 126, 43, 0.4);
      z-index: 5;
    }

    /* Right Half (600px - 1200px) */
    .right-side {
      width: 600px;
      height: 630px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 54px;
      z-index: 2;
    }

    .gold-badge {
      display: inline-flex;
      align-items: center;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 18px;
      font-weight: 600;
      color: #AD7E2B;
      border: 1px solid #AD7E2B;
      padding: 6px 18px;
      border-radius: 9999px;
      width: fit-content;
      margin-bottom: 22px;
      letter-spacing: 0.03em;
    }

    .headline {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 38px;
      font-weight: 500;
      color: #F7F2E9;
      line-height: 1.25;
      margin-bottom: 20px;
    }

    .subline {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 18px;
      font-weight: 500;
      color: #9FB2A9;
      margin-bottom: 28px;
      letter-spacing: 0.01em;
    }

    .bottom-url {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #AD7E2B;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="og-container">
    <!-- Left Half -->
    <div class="left-side">
      <img src="../images/nilufar-abdumajitovna.jpg" alt="Israilova Nilufar Abdumajitovna" class="hero-img">
      <div class="img-fade-overlay"></div>
    </div>

    <!-- Vertical Gold Divider -->
    <div class="divider-line"></div>

    <!-- Right Half -->
    <div class="right-side">
      <div class="gold-badge">Defektologiya PRO</div>
      <h1 class="headline">
        Bolalar rivojlanishi va<br>
        nutq buzilishlarini korreksiya qilish
      </h1>
      <p class="subline">8 modul · 15 yillik tajriba · Sertifikat</p>
      <span class="bottom-url">defektologiya-pro.vercel.app</span>
    </div>
  </div>
</body>
</html>
