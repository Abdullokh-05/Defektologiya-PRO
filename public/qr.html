<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator — Defektologiya PRO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@500;600&display=swap" rel="stylesheet">
  <!-- QRCode.js library from cdnjs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: #F7F2E9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Plus Jakarta Sans", system-ui, sans-serif;
      padding: 2rem 1rem;
    }

    .qr-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
    }

    #qrcode {
      width: 400px;
      height: 400px;
      padding: 16px;
      background-color: #F7F2E9;
      border: 1px solid rgba(173, 126, 43, 0.25);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(31, 46, 61, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrcode img,
    #qrcode canvas {
      display: block;
      border-radius: 8px;
    }

    .qr-label {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 14px;
      font-weight: 600;
      color: #1F2E3D;
      letter-spacing: 0.04em;
    }

    .download-btn {
      background: #AD7E2B;
      color: #FFFFFF;
      border: none;
      border-radius: 9999px;
      padding: 0.85rem 2rem;
      font-family: "Plus Jakarta Sans", sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(173, 126, 43, 0.3);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .download-btn:hover {
      background: #936821;
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(173, 126, 43, 0.4);
    }

    .download-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="qr-card">
    <div id="qrcode"></div>
    <span class="qr-label">defektologiya-pro.vercel.app</span>
    <button type="button" class="download-btn" id="downloadBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      PNG yuklab olish
    </button>
  </div>

  <script>
    // Generate 400x400 QR code
    const qrContainer = document.getElementById("qrcode");
    const qr = new QRCode(qrContainer, {
      text: "https://defektologiya-pro.vercel.app/",
      width: 368,
      height: 368,
      colorDark: "#1F2E3D",
      colorLight: "#F7F2E9",
      correctLevel: QRCode.CorrectLevel.H
    });

    // Download Handler
    document.getElementById("downloadBtn").addEventListener("click", () => {
      const canvas = qrContainer.querySelector("canvas");
      let dataUrl = "";
      
      if (canvas) {
        // Create full 400x400 canvas with padding
        const finalCanvas = document.createElement("canvas");
        finalCanvas.width = 400;
        finalCanvas.height = 400;
        const ctx = finalCanvas.getContext("2d");
        
        ctx.fillStyle = "#F7F2E9";
        ctx.fillRect(0, 0, 400, 400);
        ctx.drawImage(canvas, 16, 16, 368, 368);
        dataUrl = finalCanvas.toDataURL("image/png");
      } else {
        const img = qrContainer.querySelector("img");
        if (img) dataUrl = img.src;
      }

      if (dataUrl) {
        const link = document.createElement("a");
        link.download = "defektologiya-pro-qr.png";
        link.href = dataUrl;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }
    });
  </script>
</body>
</html>
